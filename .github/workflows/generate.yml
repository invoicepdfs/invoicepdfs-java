name: Generate SDK

# Regenerate this client from the OpenAPI spec in invoicepdfs-openapi.
# Run manually (Actions tab) or triggered automatically when the spec updates.
# Requires org/repo secret SDK_SYNC_TOKEN (read access to invoicepdfs-openapi).

on:
  workflow_dispatch:
  repository_dispatch:
    types: [spec-updated]

permissions:
  contents: write

concurrency:
  group: generate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest OpenAPI spec
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/invoicepdfs/invoicepdfs-openapi/contents/openapi-3.0.json?ref=main" \
            -o openapi.json

      - name: Generate client (java)
        run: |
          # The generator reads .openapi-generator-ignore from its *output* dir,
          # so seed .gen with it — otherwise generating out-of-tree would
          # silently re-emit README.md and clobber the hand-written one when the
          # tree is copied back.
          mkdir -p .gen
          cp .openapi-generator-ignore .gen/

          docker run --rm -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.7.0 generate \
            -i /local/openapi.json -g java -o /local/.gen \
            --additional-properties="groupId=com.invoicepdfs,artifactId=invoicepdfs,invokerPackage=com.invoicepdfs"

          # The container writes as root, so the runner cannot delete what it
          # produced — take ownership before the cleanup below, which otherwise
          # fails with "Permission denied".
          sudo chown -R "$(id -u):$(id -g)" .gen

          # Replace the tree wholesale. Generating in place and committing with
          # `git add -A` stages additions and edits but can never remove a file
          # the generator stopped emitting — which is how three dead API classes
          # stayed in the published packages for eleven regeneration cycles.
          # Everything kept below is what .openapi-generator-ignore protects,
          # plus git and CI metadata.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.gen' \
            ! -name '.github' \
            ! -name '.openapi-generator-ignore' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +
          cp -a .gen/. ./
          rm -rf .gen

      - name: Commit regenerated client
        run: |
          rm -f openapi.json
          git config user.name "invoicepdfs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Regenerate client from OpenAPI spec"
            for a in 1 2 3 4 5; do
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
              git push && break
              echo "push retry $a"; sleep $((a * 3))
            done
          fi
